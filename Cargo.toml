[package]
name = "rayetch"
version = "1.0.0-beta.3"
description = "RayEtch - free laser design and control software"
license = "Apache-2.0"
edition = "2024"

[dependencies]
rfd = "0.18"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serialport = "4"
ttf-parser = "0.25"
usvg = "0.49"
eframe = { version = "0.37", features = ["glow"] }
epaint_default_fonts = "0.37"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "ico", "gif", "tiff", "tga", "webp"] }
muda = "0.21.2"
sys-locale = "0.3.2"
i_overlay = "9.1.0"
roxmltree = "0.21"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSData"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSImage"] }

# the web tool window (Strumenti Web): the system web engine on every system
# (WebKit on macOS, WebView2 on Windows, WebKitGTK 4.1 on Linux)
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tao = "0.34"
wry = "0.53"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[build-dependencies]
winresource = "0.1"
cc = "1"
